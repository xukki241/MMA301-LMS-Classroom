$kind: "http-request"
name: "Login Student (Auto-save Token)"
description: "Đăng nhập bằng tài khoản Student và tự động lưu `student_token` vào Environment."
url: "{{auth_url}}/auth/login"
method: "POST"
headers:
  Content-Type: "application/json"
body:
  type: "json"
  content: "{\n  \"email\": \"{{student_email}}\",\n  \"password\": \"{{student_password}}\"\n}"
scripts:
  - {"type":"afterResponse","code":"const jsonData = pm.response.json();\nif (jsonData.token) {\n    pm.environment.set(\"student_token\", jsonData.token);\n    console.log(\"Student token auto-saved:\", jsonData.token);\n}","language":"text/javascript"}
order: 3000
