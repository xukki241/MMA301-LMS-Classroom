# Local: Mongo + Auth + Core. Mobile gọi thẳng :4001 / :4002.
# nginx / Socket.IO / Redis realtime: task LMS-18 & LMS-21 — làm sau cùng, chưa triển khai.

services:
  mongo:
    image: mongo:7
    container_name: lms-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27018}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-lms}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-lms_dev_password}
    volumes:
      - lms_mongo_data:/data/db
      - ./infra/mongo/init.js:/docker-entrypoint-initdb.d/init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s

  auth-service:
    build:
      context: ./services/auth-service
    container_name: lms-auth
    restart: unless-stopped
    ports:
      - "${AUTH_PORT:-4001}:4001"
    environment:
      NODE_ENV: production
      PORT: 4001
      TRUST_PROXY: ${TRUST_PROXY:-false}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      JSON_BODY_LIMIT: ${JSON_BODY_LIMIT:-10mb}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-lms}:${MONGO_ROOT_PASSWORD:-lms_dev_password}@mongo:27017/lms_auth?authSource=admin
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 25s

  core-api:
    build:
      context: ./services/core-api
    container_name: lms-core
    restart: unless-stopped
    ports:
      - "${CORE_PORT:-4002}:4002"
    environment:
      NODE_ENV: production
      PORT: 4002
      TRUST_PROXY: ${TRUST_PROXY:-false}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      JSON_BODY_LIMIT: ${JSON_BODY_LIMIT:-10mb}
      JWT_SECRET: ${JWT_SECRET}
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-lms}:${MONGO_ROOT_PASSWORD:-lms_dev_password}@mongo:27017/lms_core?authSource=admin
      # Device-reachable for Android emulator WebBrowser (hosted-launch).
      PUBLIC_CORE_URL: ${PUBLIC_CORE_URL:-http://10.0.2.2:4002}
      # Optional public/tunnel base for SePay success/error/cancel (defaults to PUBLIC_CORE_URL).
      SEPAY_RETURN_BASE_URL: ${SEPAY_RETURN_BASE_URL:-}
      SEPAY_MERCHANT_ID: ${SEPAY_MERCHANT_ID:-}
      SEPAY_SECRET_KEY: ${SEPAY_SECRET_KEY:-}
      SEPAY_CHECKOUT_URL: ${SEPAY_CHECKOUT_URL:-}
      SEPAY_BANK_CODE: ${SEPAY_BANK_CODE:-}
      SEPAY_BANK_ACCOUNT: ${SEPAY_BANK_ACCOUNT:-}
      SEPAY_BANK_NAME: ${SEPAY_BANK_NAME:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-lms-classroom}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 25s

volumes:
  lms_mongo_data:
