# Local / LAN: nginx :8080 → auth + core. Render không dùng file này (xem render.yaml).
# Mongo data nằm volume Docker — không dùng disk ephemeral kiểu Render.

services:
  mongo:
    image: mongo:7
    container_name: lms-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27018}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-lms}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-lms_dev_password}
    volumes:
      - lms_mongo_data:/data/db
      - ./infra/mongo/init.js:/docker-entrypoint-initdb.d/init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s

  auth-service:
    build:
      context: ./services/auth-service
    container_name: lms-auth
    restart: unless-stopped
    ports:
      - "${AUTH_PORT:-4001}:4001"
    environment:
      NODE_ENV: production
      PORT: 4001
      TRUST_PROXY: "true"
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      JSON_BODY_LIMIT: ${JSON_BODY_LIMIT:-10mb}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-lms}:${MONGO_ROOT_PASSWORD:-lms_dev_password}@mongo:27017/lms_auth?authSource=admin
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 25s

  core-api:
    build:
      context: ./services/core-api
    container_name: lms-core
    restart: unless-stopped
    ports:
      - "${CORE_PORT:-4002}:4002"
    environment:
      NODE_ENV: production
      PORT: 4002
      TRUST_PROXY: "true"
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      JSON_BODY_LIMIT: ${JSON_BODY_LIMIT:-10mb}
      JWT_SECRET: ${JWT_SECRET}
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-lms}:${MONGO_ROOT_PASSWORD:-lms_dev_password}@mongo:27017/lms_core?authSource=admin
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 25s

  nginx:
    image: nginx:1.27-alpine
    container_name: lms-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      auth-service:
        condition: service_healthy
      core-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: lms-redis
    profiles: ["realtime"]
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - lms_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  lms_mongo_data:
  lms_redis_data:
