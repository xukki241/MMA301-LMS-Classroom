worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;
    server_tokens      off;

    # Upload ảnh / nộp bài — Core API cũng giới hạn JSON qua JSON_BODY_LIMIT
    client_max_body_size 20m;
    client_body_timeout  30s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_types
        application/json
        application/javascript
        application/xml
        text/plain
        text/css
        text/xml;

    # Rate limit nhẹ: đủ chống burst, không chặn demo nhóm (~30 req/s/IP)
    limit_req_zone $binary_remote_addr zone=lms_api:10m rate=30r/s;

    log_format main '$remote_addr $request $status $body_bytes_sent rt=$request_time';
    access_log /var/log/nginx/access.log main;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Docker embedded DNS — nginx không crash nếu backend chưa resolve lúc start
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;

        # CORS để Express xử lý (mobile native không cần; Expo web cần app set header).
        # Không hardcode Access-Control-Allow-Origin ở đây.

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        limit_req zone=lms_api burst=60 nodelay;

        # Healthcheck bản thân nginx (Render local compose / Docker health)
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location = /health/auth {
            set $auth_upstream http://auth-service:4001;
            proxy_pass $auth_upstream/health;
        }

        location = /health/core {
            set $core_upstream http://core-api:4002;
            proxy_pass $core_upstream/health;
        }

        # Chat/realtime (chưa có ở MVP) — sẵn Upgrade khi Core bật Socket.IO
        location /socket.io/ {
            set $core_upstream http://core-api:4002;
            proxy_pass $core_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
        }

        # Auth Service: POST /auth/register, POST /auth/login
        location /auth/ {
            set $auth_upstream http://auth-service:4001;
            proxy_pass $auth_upstream;
        }

        # Core API: GET /health, GET /me, /classes, ...
        location / {
            set $core_upstream http://core-api:4002;
            proxy_pass $core_upstream;
        }
    }
}
