services:
  - type: web
    name: mma301-lms-auth
    runtime: docker
    dockerfilePath: ./services/auth-service/Dockerfile
    dockerContext: ./services/auth-service
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4001"
      - key: TRUST_PROXY
        value: "true"
      - key: CORS_ORIGIN
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: MONGO_URI
        sync: false

  - type: web
    name: mma301-lms-core
    runtime: docker
    # Staging service mma301-lms-core-staging (srv-davt47rtqb8s73dn5al0) tracks main;
    # payment/SePay routes must be on main for that deploy. Prefer develop→main promote.
    branch: main
    dockerfilePath: ./services/core-api/Dockerfile
    dockerContext: ./services/core-api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4002"
      - key: TRUST_PROXY
        value: "true"
      - key: CORS_ORIGIN
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: MONGO_URI
        sync: false
      # SePay LIVE — set in Render dashboard / MCP; never commit values.
      # IPN: https://mma301-lms-core-staging.onrender.com/payments/sepay/ipn
      - key: SEPAY_MERCHANT_ID
        sync: false
      - key: SEPAY_SECRET_KEY
        sync: false
      - key: SEPAY_CHECKOUT_URL
        sync: false
      - key: SEPAY_BANK_CODE
        sync: false
      - key: SEPAY_BANK_ACCOUNT
        sync: false
      - key: SEPAY_BANK_NAME
        sync: false
      - key: PUBLIC_CORE_URL
        sync: false
      - key: SEPAY_RETURN_BASE_URL
        sync: false
